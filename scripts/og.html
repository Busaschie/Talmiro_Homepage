<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
@font-face{font-family:PJS;src:url(og-font-800.woff2);font-weight:800}
@font-face{font-family:IN;src:url(og-font-inter.woff2);font-weight:500}
html,body{margin:0;width:1200px;height:630px}
body{background:linear-gradient(135deg,#ffffff 0%,#f5f8fa 100%);display:flex;flex-direction:column;justify-content:center;padding:0 90px;box-sizing:border-box;gap:28px;position:relative;overflow:hidden}
.bar{position:absolute;left:0;top:0;bottom:0;width:18px;background:linear-gradient(180deg,#14305e,#1aa3a3)}
.row{display:flex;align-items:center;gap:32px}
.row img{width:161px;height:140px;border-radius:28px}
.w{font-family:PJS;font-weight:800;font-size:96px;letter-spacing:8px;background:linear-gradient(90deg,#14305e 0%,#1f5c8a 45%,#1aa3a3 100%);-webkit-background-clip:text;color:transparent}
.c{font-family:PJS;font-weight:800;font-size:68px;color:#14305e;line-height:1.1}
.s{font-family:IN;font-weight:500;font-size:30px;color:#3d4a5c}
</style></head><body><div class="bar"></div>
<div class="row"><img src="og-mark.webp" alt=""><div class="w">TALMIRO</div></div>
<div class="c">Recruiting per Zuruf.</div>
<div class="s">Der KI-Assistent für selbstständige Headhunter</div>
</body></html>
